<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bitácora</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Bitácora">
<meta name="theme-color" content="#edf0f3" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0c131a" media="(prefers-color-scheme: dark)">
<link rel="apple-touch-icon" href="foto-180.png">
<link rel="icon" type="image/png" href="foto-192.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Layout: libreta de gimnasio en una columna; cabecera fija arriba, pestañas abajo; tarjetas solo para sesiones y formularios */
:root{
  --bg:#edf0f3;--surface:#ffffff;--sunk:#f4f6f8;--ink:#101a24;--muted:#556375;--line:#d4dbe3;
  --accent:#2347c5;--accent-ink:#ffffff;--accent-soft:#e1e8fb;
  --good:#16764a;--good-soft:#dbf0e4;--warn:#875a00;--warn-dot:#d6990f;--warn-soft:#faefcf;--bad:#b4372a;--bad-soft:#f7ded9;
  --shadow:0 8px 28px rgba(16,26,36,.16);
  --logo-bg:#111a22;--logo-fg:#ffffff;
  --font-display:"Barlow Condensed","Arial Narrow","Roboto Condensed",sans-serif;
  --font-body:"Barlow","Segoe UI",system-ui,-apple-system,sans-serif;
  --r:14px;--tabh:62px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0c131a;--surface:#141d27;--sunk:#101821;--ink:#e6ecf2;--muted:#94a3b4;--line:#263342;
  --accent:#86a2ff;--accent-ink:#0b1220;--accent-soft:#1d2a52;
  --good:#52c487;--good-soft:#123020;--warn:#e9b84f;--warn-dot:#e9b84f;--warn-soft:#33290f;--bad:#f27a66;--bad-soft:#3b1c17;
  --shadow:0 8px 28px rgba(0,0,0,.5);color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0c131a;--surface:#141d27;--sunk:#101821;--ink:#e6ecf2;--muted:#94a3b4;--line:#263342;
  --accent:#86a2ff;--accent-ink:#0b1220;--accent-soft:#1d2a52;
  --good:#52c487;--good-soft:#123020;--warn:#e9b84f;--warn-dot:#e9b84f;--warn-soft:#33290f;--bad:#f27a66;--bad-soft:#3b1c17;
  --shadow:0 8px 28px rgba(0,0,0,.5);color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.45;font-variant-numeric:tabular-nums}
body{margin:0;padding-top:env(safe-area-inset-top,0px)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
.wrap{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h2,h3,p{margin:0}
.muted{color:var(--muted)}
.sm{font-size:13px}
.between{justify-content:space-between}
.row{display:flex;align-items:center;gap:8px}
.stack{display:flex;flex-direction:column;gap:14px}
.stack-sm{display:flex;flex-direction:column;gap:8px}
.label{display:block;font-size:12px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.h{font-family:var(--font-display);font-weight:800;font-size:26px;line-height:1.02;letter-spacing:.01em;text-transform:uppercase;text-wrap:balance}

/* Cabecera */
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
header.top .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:10px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.logo{flex:none;width:40px;height:40px;border-radius:10px;display:grid;place-items:center;background:var(--logo-bg);color:var(--logo-fg);border:1px solid var(--line)}
.logo svg{display:block;width:32px;height:auto}
.brand-name{font-family:var(--font-display);font-weight:800;font-size:23px;line-height:1;text-transform:uppercase;letter-spacing:.03em}
.brand-sub{font-size:12.5px;color:var(--muted);line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.save{flex:none;display:flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;color:var(--muted);white-space:nowrap}
.save i{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.save[data-s="ok"] i{background:var(--good)}
.save[data-s="saving"] i,.save[data-s="connecting"] i{background:var(--accent);animation:pulse 1s ease-in-out infinite}
.save[data-s="dirty"] i{background:var(--accent)}
.save[data-s="local"] i{background:var(--good)}
.save[data-s="offline"] i{background:var(--warn-dot)}
.save[data-s="error"] i{background:var(--bad)}
@keyframes pulse{50%{opacity:.3}}

main{padding-block:16px calc(var(--tabh) + env(safe-area-inset-bottom,0px) + 40px)}
#banner{margin-bottom:14px}
#banner:empty{display:none}
.view{display:flex;flex-direction:column;gap:14px}

/* Pestañas */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.tabrow{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,minmax(0,1fr))}
nav.tabs a{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-height:var(--tabh);color:var(--muted);text-decoration:none;font-size:11.5px;font-weight:600;letter-spacing:.02em}
nav.tabs a[aria-current="page"]{color:var(--accent)}
nav.tabs svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

/* Controles */
.btn{appearance:none;-webkit-appearance:none;display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:0 16px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:600 15px/1.1 var(--font-body);text-decoration:none;cursor:pointer;touch-action:manipulation}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--accent);padding:0 10px}
.btn.danger{color:var(--bad)}
.btn.sm{min-height:36px;padding:0 12px;font-size:14px;border-radius:10px}
.btn.icon{width:44px;padding:0}
.btn.icon svg{width:22px;height:22px}
.btn.block{width:100%}
.btn:disabled{opacity:.45;cursor:default}
.btn:focus-visible,.seg button:focus-visible,.pain button:focus-visible,.tick:focus-visible,input:focus-visible,textarea:focus-visible,summary:focus-visible,nav.tabs a:focus-visible,.hit:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
input.num,input.text,textarea{width:100%;min-width:0;border:1px solid var(--line);border-radius:10px;background:var(--sunk);color:var(--ink);font:500 16px/1.3 var(--font-body)}
input.num{height:46px;text-align:center;font-weight:700;font-size:18px;font-variant-numeric:tabular-nums;padding:0 4px}
input.text{height:46px;padding:0 10px}
textarea{padding:10px 12px;resize:vertical}
.seg{display:flex;gap:6px}
.seg.wrap{flex-wrap:wrap}
.seg button{flex:1 1 0;min-width:44px;min-height:44px;padding:6px 10px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:600 15px/1.15 var(--font-body);cursor:pointer;touch-action:manipulation}
.seg.wrap button{flex:1 1 auto}
.seg button[aria-checked="true"],.seg button[aria-selected="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.pain{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px}
.pain.ten{grid-template-columns:repeat(5,minmax(0,1fr))}
.pain button{min-height:44px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:700 16px/1 var(--font-body);cursor:pointer;touch-action:manipulation}
.pain button[aria-checked="true"]{border-width:2px}
.pain button[aria-checked="true"][data-b="g"]{background:var(--good-soft);border-color:var(--good);color:var(--good)}
.pain button[aria-checked="true"][data-b="y"]{background:var(--warn-soft);border-color:var(--warn-dot);color:var(--warn)}
.pain button[aria-checked="true"][data-b="r"]{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
.pain button[aria-checked="true"][data-b="n"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.field{display:flex;flex-direction:column;gap:8px;min-width:0}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.stepper{display:flex;align-items:center;gap:12px}
.stepper output{min-width:84px;text-align:center;font-size:15px;color:var(--muted)}
.stepper output b{font-family:var(--font-display);font-size:30px;font-weight:800;color:var(--ink);margin-right:2px}
.stepper.mini{gap:6px}
.stepper.mini .btn.icon{width:42px;flex:none}
.stepper.mini output{min-width:0;flex:1 1 auto}
.stepper.mini output b{font-size:26px;margin:0}
.vals{font-weight:700}
.lnk{color:var(--accent);font-weight:600;text-decoration:none;white-space:nowrap}
#pesoCard,#cform{scroll-margin-top:84px}

/* Tarjetas */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.pad{padding:16px}
.banner{border-radius:12px;padding:12px 14px;font-size:14.5px;line-height:1.4;background:var(--sunk);border:1px solid var(--line)}
.banner[data-l="amarillo"]{background:var(--warn-soft);border-color:transparent}
.banner[data-l="rojo"]{background:var(--bad-soft);border-color:transparent}
.empty{display:flex;flex-direction:column;gap:6px;align-items:flex-start;padding:14px;border:1px dashed var(--line);border-radius:12px;color:var(--muted)}
.empty b{color:var(--ink)}

/* Fecha */
.datenav{display:grid;grid-template-columns:44px minmax(0,1fr) 44px;gap:8px;align-items:center}
.datebtn{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:56px;padding:4px 8px;border-radius:12px;background:var(--surface);border:1px solid var(--line);cursor:pointer;text-align:center}
.datebtn b{font-family:var(--font-display);font-weight:800;font-size:24px;line-height:1.05;text-transform:uppercase;letter-spacing:.02em}
.datebtn small{font-size:12.5px;color:var(--muted)}
.datebtn input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;font-size:16px}

/* Semáforo */
.light{display:inline-flex;align-items:center;gap:8px;padding:5px 12px 5px 8px;border-radius:999px;font-weight:700;font-size:14px;background:var(--sunk);border:1px solid var(--line);white-space:nowrap}
.light i,.dot{width:12px;height:12px;border-radius:50%;background:var(--muted);flex:none;display:inline-block}
.light[data-l="verde"]{background:var(--good-soft);border-color:transparent;color:var(--good)}
.light[data-l="amarillo"]{background:var(--warn-soft);border-color:transparent;color:var(--warn)}
.light[data-l="rojo"]{background:var(--bad-soft);border-color:transparent;color:var(--bad)}
.light[data-l="verde"] i,.dot.verde{background:var(--good)}
.light[data-l="amarillo"] i,.dot.amarillo{background:var(--warn-dot)}
.light[data-l="rojo"] i,.dot.rojo{background:var(--bad)}
.knee-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 12px 12px 16px}
.knee-row .row{flex-wrap:wrap;gap:6px 10px}
.verdict{display:flex;flex-direction:column;gap:8px;padding:14px;border-radius:12px;background:var(--sunk)}
.verdict[data-l="verde"]{background:var(--good-soft)}
.verdict[data-l="amarillo"]{background:var(--warn-soft)}
.verdict[data-l="rojo"]{background:var(--bad-soft)}
.guide summary{cursor:pointer;list-style:none;display:flex;justify-content:space-between;align-items:center;min-height:28px}
.guide summary::-webkit-details-marker{display:none}
.guide summary::after{content:"+";font-size:22px;color:var(--muted)}
.guide[open] summary::after{content:"−"}
.g-row{display:grid;grid-template-columns:118px minmax(0,1fr);gap:12px;align-items:start}

/* Sesión */
.slots button{display:flex;flex-direction:column;gap:2px;align-items:center;text-align:center;font-weight:600}
.slots button b{font-family:var(--font-display);font-size:18px;font-weight:800;letter-spacing:.04em}
.session{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.sess-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding:16px 16px 14px;border-bottom:1px solid var(--line)}
.sess-head h2{font-family:var(--font-display);font-weight:800;font-size:32px;line-height:.95;text-transform:uppercase;letter-spacing:.01em}
.sess-meta{margin-top:6px;font-size:13.5px;color:var(--muted)}
.sess-meta .ok{color:var(--good);font-weight:700}
.sess-pre{padding:10px 16px;font-size:14px;color:var(--muted);border-bottom:1px solid var(--line)}
.sess-warn{padding:10px 16px;font-size:14px;font-weight:600;background:var(--bad-soft);border-bottom:1px solid var(--line)}
.group{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 16px;background:var(--sunk);border-bottom:1px solid var(--line);font-size:13px}
.ex{display:flex;flex-direction:column;gap:10px;padding:14px 16px 16px;border-bottom:1px solid var(--line)}
.ex.skip{opacity:.55}
.ex-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.ex-title{min-width:0}
.ex h3{font-size:17px;font-weight:700;line-height:1.2}
.presc{margin-top:2px;font-size:14px;font-weight:600;color:var(--accent)}
.presc.txt{color:var(--ink);font-weight:500}
.note{font-size:13.5px;color:var(--muted)}
.subnote{font-size:13.5px;font-weight:600;padding:8px 10px;border-radius:10px;background:var(--warn-soft)}
.subnote[data-l="rojo"]{background:var(--bad-soft)}
.prog{flex:none;font-size:12.5px;font-weight:700;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:3px 10px;white-space:nowrap}
.prog.full{color:var(--good);border-color:var(--good);background:var(--good-soft)}
.sets{display:flex;flex-direction:column;gap:6px}
.set,.set-head{display:grid;grid-template-columns:30px minmax(0,1fr) 14px minmax(0,1fr) 50px;gap:8px;align-items:center}
.set.noload,.set-head.noload{grid-template-columns:30px minmax(0,1fr) 50px}
.set-head{font-size:11.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);text-align:center}
.set-head span:first-child{text-align:left}
.set-n{font-weight:700;color:var(--muted);text-align:center;font-size:15px}
.x{color:var(--muted);text-align:center}
.set.is-done input.num{background:var(--accent-soft);border-color:transparent}
.tick{width:50px;height:46px;display:grid;place-items:center;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);color:var(--muted);cursor:pointer;touch-action:manipulation}
.tick svg{width:24px;height:24px}
.tick[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.set-tools{display:flex;gap:4px;margin-left:30px}
.hint{font-size:13.5px;color:var(--muted)}
.hint b{color:var(--ink)}
.rir{display:flex;flex-direction:column;gap:6px}
.checkbtn{align-self:flex-start}
.checkbtn svg{width:20px;height:20px}
.checkbtn[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.lr{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.lr-col{display:flex;flex-direction:column;gap:6px;min-width:0}
.lr-in{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:6px;align-items:center}
.lr-in .x{font-size:13px}
.count{display:flex;align-items:center;gap:14px}
.count output{font-size:15px;color:var(--muted)}
.count output b{font-family:var(--font-display);font-size:34px;font-weight:800;color:var(--ink);margin-right:4px}
.logged{display:flex;gap:6px;align-items:flex-start;font-size:14px;font-weight:600;color:var(--good)}
.logged svg{width:18px;height:18px;flex:none;margin-top:1px}
.sess-foot{display:flex;flex-direction:column;gap:14px;padding:16px;background:var(--sunk)}

/* Trote y progreso */
.weeknav{display:grid;grid-template-columns:44px minmax(0,1fr) 44px;gap:8px;align-items:center;text-align:center}
.weeknav b{display:block;font-family:var(--font-display);font-weight:800;font-size:24px;text-transform:uppercase;line-height:1.05}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:2px;min-width:0}
.stat b{font-family:var(--font-display);font-weight:800;font-size:28px;line-height:1}
.stat small{font-size:12.5px;color:var(--muted)}
.entry{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.entry:last-child{border-bottom:0}
.entry-main{min-width:0}
.entry-act{display:flex;gap:6px;flex:none}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chips button{flex:none;min-height:38px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:600 14px/1 var(--font-body);cursor:pointer;white-space:nowrap}
.chips button[aria-selected="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.kpi{display:flex;flex-direction:column;gap:2px}
.big{display:block;font-family:var(--font-display);font-weight:800;font-size:40px;line-height:1}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend .sw{width:14px;height:10px;border-radius:3px;background:var(--accent);display:inline-block}
.legend .sw.dotk{width:10px;height:10px;border-radius:50%;background:var(--ink)}
.legend .sw.plan{width:14px;height:0;border-top:2px dashed var(--muted);border-radius:0;background:none}
.legend .sw.short{background:var(--warn-dot)}
.legend .sw.dotm{width:10px;height:10px;border-radius:50%;background:var(--muted)}
.legend .sw.line{height:0;border-top:2px solid var(--accent);border-radius:0;background:none}
.test{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.test:last-child{border-bottom:0}
.test-v{text-align:right;display:flex;flex-direction:column;align-items:flex-end;gap:2px;flex:none}
.test-v b{font-family:var(--font-display);font-size:24px;font-weight:800;line-height:1}
.delta{font-size:12.5px;font-weight:700;color:var(--muted)}
.delta.up{color:var(--good)}
.delta.down{color:var(--bad)}
.tform summary{list-style:none}
.tform summary::-webkit-details-marker{display:none}
#sumText{font:500 14px/1.45 var(--font-body);min-height:220px;background:var(--sunk)}

/* Historial */
.day{display:flex;flex-direction:column}
.day h3{font-family:var(--font-display);font-weight:800;font-size:20px;text-transform:uppercase;letter-spacing:.02em;padding:6px 0}
.item{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.item-main{display:flex;gap:10px;align-items:flex-start;min-width:0}
.item-main .dot{margin-top:5px}
.item-main p{overflow-wrap:anywhere}

/* Gráficos */
.chart{display:block;width:100%;height:auto;overflow:visible}
.chart text{font-family:var(--font-body);font-size:11px;fill:var(--muted)}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart .axis{stroke:var(--muted);stroke-width:1}
.chart .ln{fill:none;stroke:var(--accent);stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.chart .pt{fill:var(--accent);stroke:var(--surface);stroke-width:2}
.chart .pt.verde{fill:var(--good)}
.chart .pt.amarillo{fill:var(--warn-dot)}
.chart .pt.rojo{fill:var(--bad)}
.chart .ref{stroke:var(--muted);stroke-width:1;stroke-dasharray:4 4}
.chart .reflbl{font-size:10.5px}
.chart .endlbl{font-size:12.5px;font-weight:700;fill:var(--ink)}

<script>
(() => {

/* ---------------- Plan del bloque 1 ---------------- */

const KNEE_MINI = ['rod_ext','rod_step','rod_trineo','rod_cph','rod_gem'];
const SESS = {

  carrera:{name:'Carrera y saltos',time:'~60 min',pre:'Al aire libre y sin implementos, en pasto o cancha plana. 15 min de calentamiento y técnica de carrera (skipping, talones, progresivos) antes de las aceleraciones, y 5 min de trote suave al final.',items:['calentOut','acel','saltoAdel','frenar','frenado','interm']},

const PLAN_CHANGE = '2026-11-05'; // desde aquí: una sesión por día
const DAY_PLAN_NEW = {0:['fondo'],1:['piernaA'],2:['torsoA'],3:['carrera'],4:['torsoB'],5:['bisagra'],6:['libre']};
const dayPlan = date => (date < PLAN_CHANGE ? DAY_PLAN_OLD : DAY_PLAN_NEW)[parse(date).getDay()];
const INTERM = {1:'2×6 min',2:'2×7 min',3:'2×8 min',4:'2×6 min',5:'3×6 min',6:'3×7 min',7:'3×8 min',8:'2×6 min'};
const FONDO = {1:8,2:8,3:9,4:7,5:10,6:11,7:12,8:9};
const CTYPES = [
  {k:'fondo',name:'Fondo largo',run:true},

  {k:'intermitente',name:'Intermitente',run:true},
  {k:'aceleraciones',name:'Aceleraciones',run:true},
  {k:'bici',name:'Bici o elíptica',run:false},

];
const CT = Object.fromEntries(CTYPES.map(t => [t.k, t]));
const TESTS = [
  {k:'salto',name:'Salto largo a pies juntos',unit:'cm',better:1,hint:'El mejor de 3 intentos.'},
  {k:'simetria',name:'Extensión a una pierna',unit:'%',better:1,pair:true,hint:'Mismo peso en cada pierna, repeticiones máximas. Simetría = operada ÷ sana.'},
  {k:'dom10',name:'Dominada con +10 kg',unit:'reps',better:1,hint:'Repeticiones máximas limpias.'},
  {k:'militar5',name:'Press militar 5RM',unit:'kg',better:1,hint:'El peso con el que haces 5 repeticiones.'},
  {k:'cinco',name:'5 km contra reloj',unit:'',better:-1,time:true,hint:'En plano y solo con la rodilla en verde. Escribe el tiempo como mm:ss.'},
  {k:'sprint10',name:'Sprint de 10 m',unit:'s',better:-1,hint:'Cronometrado; un video en cámara lenta sirve. Solo con la rodilla en verde.'},

const TT = Object.fromEntries(TESTS.map(t => [t.k, t]));
const LIGHT = {
  verde:{word:'Verde',signs:'Dolor 0–2 y al día siguiente igual que siempre',todo:'Sigue la progresión.'},
  amarillo:{word:'Amarillo',signs:'Dolor 3–4, molestia que dura al día siguiente o te cuesta un poco estirarla',todo:'Repite la semana sin subir cargas, cambia trote por bici o caminata y baja 30% el volumen de pierna.'},

};
const ICON = {
  check:'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>',
  left:'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14.5 5.5L8 12l6.5 6.5" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>',
  right:'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9.5 5.5L16 12l-6.5 6.5" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>',
};

/* ---------------- Utilidades ---------------- */
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clone = o => JSON.parse(JSON.stringify(o));
const pad = n => String(n).padStart(2, '0');
const iso = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const parse = s => { const [y, m, d] = String(s).split('-').map(Number); return new Date(y, m - 1, d, 12); };
const addDays = (s, n) => { const d = parse(s); d.setDate(d.getDate() + n); return iso(d); };
const todayISO = () => iso(new Date());
const validDate = s => /^\d{4}-\d{2}-\d{2}$/.test(s || '');
const DOW = ['dom','lun','mar','mié','jue','vie','sáb'];
const DOW_L = ['Domingo','Lunes','Martes','Miércoles','Jueves','Viernes','Sábado'];
const MON = ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
const dayLabel = s => { const d = parse(s); return `${DOW_L[d.getDay()]} ${d.getDate()} ${MON[d.getMonth()]}`; };
const shortDay = s => { const d = parse(s); return `${DOW[d.getDay()]} ${d.getDate()}`; };
const shortDate = s => { const d = parse(s); return `${d.getDate()} ${MON[d.getMonth()]}`; };
const daysBetween = (a, b) => Math.round((parse(b) - parse(a)) / 864e5);
const weekOf = s => Math.floor(daysBetween(START, s) / 7) + 1;
const clampWk = wk => Math.min(Math.max(wk, 1), BLOCK_WEEKS);
const mondayOf = s => addDays(s, -((parse(s).getDay() + 6) % 7));
const NF = new Intl.NumberFormat('es-CL', {maximumFractionDigits: 2});
const fmt = n => (n == null || !isFinite(n)) ? '—' : NF.format(n);
const inp = v => v == null ? '' : String(v).replace('.', ',');
const num = v => { if (v == null) return null; const s = String(v).trim().replace(',', '.'); if (s === '') return null; const n = Number(s); return isFinite(n) ? n : null; };
const round4 = x => Math.round(x * 4) / 4;
const sum = a => a.reduce((s, v) => s + (v || 0), 0);
const avg = a => a.length ? sum(a) / a.length : null;
const e1rm = (kg, reps) => (kg == null || !reps) ? null : kg * (1 + reps / 30);
const mmss = sec => { if (sec == null) return '—'; const s = Math.round(sec); return `${Math.floor(s / 60)}:${pad(s % 60)}`; };
const parseTime = t => { const m = String(t || '').trim().match(/^(\d{1,3})[:.,](\d{1,2})$/); if (m) return Number(m[1]) * 60 + Number(m[2]); const n = num(t); return n == null ? null : n * 60; };
const countTarget = (ex, wk) => (wk >= 3 && ex.target3) ? ex.target3 : ex.target;
const setsFor = (ex, wk) => isDeload(wk) ? Math.max(1, Math.round(ex.sets * 0.6)) : ex.sets;

/* ---------------- Estado ---------------- */

  settings:{bodyweight:BW_DEFAULT}, bodyEdit:null,

  mode:'connecting', loaded:{}, stale:false, pending:false,

const COLS = ['sessions','checkins','cardio','tests','body'];
const mapFor = col => ({sessions:S.sessions, checkins:S.checkins, cardio:S.cardio, tests:S.tests, body:S.body})[col];
let db = null;

/* ---------------- Guardado ---------------- */
const LS_KEY = 'bitacora-rugby21k-local-v1';
const Local = {
  read(){ try { return JSON.parse(localStorage.getItem(LS_KEY) || '{}') || {}; } catch (e) { return {}; } },
  write(o){ try { localStorage.setItem(LS_KEY, JSON.stringify(o)); return true; } catch (e) { return false; } },
  put(col, id, body){ const o = Local.read(); (o[col] = o[col] || {})[id] = body; return Local.write(o); },
  del(col, id){ const o = Local.read(); if (o[col]) delete o[col][id]; return Local.write(o); },
  clear(){ try { localStorage.removeItem(LS_KEY); } catch (e) {} },
};
const DEL = Symbol('delete');
const queues = new Map();
const timers = new Map();
const sleep = ms => new Promise(r => setTimeout(r, ms));

const SAVE_TXT = {connecting:'Conectando…', ok:'Guardado', saving:'Guardando…', dirty:'Sin guardar', local:'Guardado', error:'No se guardó', readonly:'Solo lectura', offline:'Sin conexión'};
function setSave(s){ const el = $('#save'); el.dataset.s = s; el.querySelector('span').textContent = SAVE_TXT[s] || ''; }
function idleSave(){ if (S.mode === 'local') setSave('local'); else if (S.mode === 'readonly') setSave('readonly'); else if (S.stale) setSave('offline'); else setSave('ok'); }

function put(col, id, body){
  if (S.mode === 'readonly') { toast('Solo lectura: no puedes editar esta bitácora.'); return false; }
  body = Object.assign({}, body, {updatedAt: new Date().toISOString()});
  if (col === 'settings') S.settings = Object.assign({}, S.settings, body);
  else mapFor(col).set(id, body);
  if (!db || S.mode === 'local') { Local.put(col, id, body); setSave('local'); return true; }
  enqueue(`${col}/${id}`, body);
  return true;
}
function remove(col, id){
  if (S.mode === 'readonly') { toast('Solo lectura: no puedes editar esta bitácora.'); return; }
  if (col === 'body' && bodyPend.date === id) { clearTimeout(bodyPend.t); bodyPend.rec = null; bodyPend.date = null; }
  mapFor(col).delete(id);
  if (col === 'sessions') S.drafts.delete(id);
  if (!db || S.mode === 'local') { Local.del(col, id); setSave('local'); return; }
  enqueue(`${col}/${id}`, DEL);
}
function enqueue(path, body){
  let q = queues.get(path);
  if (!q) { q = {running:false, next:null}; queues.set(path, q); }
  q.next = body;
  if (!q.running) pump(path, q);
}
async function writeOnce(path, body){ return body === DEL ? db.doc(path).delete() : db.doc(path).set(body); }
async function pump(path, q){
  q.running = true; setSave('saving');
  while (q.next !== null) {
    const body = q.next; q.next = null;
    try { await writeOnce(path, body); }
    catch (e) {
      if (e && e.code === 'unavailable') {
        await sleep(700 + Math.random() * 900);
        try { await writeOnce(path, body); } catch (e2) { writeFailed(e2, path, body); }
      } else writeFailed(e, path, body);
    }
  }
  q.running = false; queues.delete(path);
  if (![...queues.values()].some(x => x.running) && !timers.size) idleSave();
}
function writeFailed(e, path, body){
  const code = e && e.code;
  const [col, id] = path.split('/');
  if (code === 'quota_exceeded') { toast('La bitácora está llena: borra registros antiguos en Historial.'); setSave('error'); return; }
  if (code === 'invalid_argument' && S.mode !== 'local') { S.mode = 'readonly'; document.body.classList.add('ro'); renderBanner(); toast('No tienes permiso para guardar aquí.'); setSave('readonly'); return; }
  // Cualquier otro fallo: no perder lo anotado.
  if (body === DEL) Local.del(col, id); else Local.put(col, id, body);
  if (code === 'revoked' || code === 'not_granted' || code === 'capability_disabled' || code === 'capability_removed') goLocal();
  toast('No se pudo guardar en la nube: quedó en este teléfono.');
  setSave('error');
}

function ensureDraft(date, sk){
  const id = sessionId(date, sk);
  if (!S.drafts.has(id)) { const base = S.sessions.get(id); S.drafts.set(id, base ? clone(base) : newSession(date, sk)); }
  const d = S.drafts.get(id);
  d.items = d.items || {};
  return d;
}
function markDirty(id){
  if (S.mode === 'readonly') return;
  setSave('dirty');
  clearTimeout(timers.get(id));
  timers.set(id, setTimeout(() => flushSession(id), 700));
}
function flushSession(id){
  clearTimeout(timers.get(id)); timers.delete(id);
  const d = S.drafts.get(id); if (!d) return;
  put('sessions', id, clone(d));
}
function flushAll(){ [...timers.keys()].forEach(flushSession); flushBody(); }
function pruneDrafts(){ [...S.drafts.keys()].forEach(id => { if (!timers.has(id) && !queues.has(`sessions/${id}`)) S.drafts.delete(id); }); }

/* ---------------- Datos derivados ---------------- */
function allSessionEntries(){ const m = new Map(S.sessions); S.drafts.forEach((v, k) => m.set(k, v)); return [...m.entries()]; }
const allSessions = () => allSessionEntries().map(e => e[1]);
function hasDone(it, ex){
  if (!it || !ex) return false;
  if (it.sets) return it.sets.some(x => x.done);
  if (ex.kind === 'count') return (it.count || 0) > 0;
  return !!it.done;
}
function history(k, before){
  return allSessions().filter(s => s.date < before && s.items && hasDone(s.items[k], EX[k]))
    .sort((a, b) => b.date.localeCompare(a.date)).map(s => ({date:s.date, it:s.items[k]}));
}
function lightOf(c){
  if (!c) return null;
  if (c.pain == null) return c.light || null;
  if (c.swollen || c.locked || c.ext === 'mucho' || c.pain >= 5) return 'rojo';
  if (c.pain >= 3 || c.ext === 'algo') return 'amarillo';
  return 'verde';
}
const lightFor = date => lightOf(S.checkins.get(date));
function kneeAlert(date){ for (let i = 1; i <= 7; i++) { const l = lightFor(addDays(date, -i)); if (l && l !== 'verde') return true; } return false; }
function suggest(k, date){
  const ex = EX[k]; const wk = weekOf(date);
  const h = history(k, date);
  if (!h.length) return {kg: ex.start ?? null, why: ex.start != null ? 'carga de partida del plan' : 'primera vez: anota con qué peso partes'};
  const last = h[0];
  const done = last.it.sets.filter(x => x.done && x.kg != null);
  const top = done.length ? Math.max(...done.map(x => x.kg)) : (ex.start ?? null);
  if (top == null) return {kg: null, why: ''};
  if (isDeload(wk)) return {kg: top, why: 'semana de descarga: misma carga, menos series'};
  if (mondayOf(last.date) === mondayOf(date)) return {kg: top, why: 'ya la hiciste esta semana: repite la carga'};
  if (!ex.step) return {kg: top, why: 'repite la carga de la última vez'};
  const lastWk = weekOf(last.date);
  const doneSets = last.it.sets.filter(x => x.done);
  if (doneSets.length < setsFor(ex, lastWk) || doneSets.some(x => (x.reps || 0) < ex.reps)) return {kg: top, why: 'la última vez no completaste todas las series: repite'};
  if (ex.rir != null && last.it.rir != null && last.it.rir < ex.rir) return {kg: top, why: `la última vez quedaste en RIR ${last.it.rir}: repite`};
  if (ex.knee && kneeAlert(date)) return {kg: top, why: 'rodilla en amarillo o rojo esta semana: repite'};
  return {kg: round4(top + ex.step), why: `+${fmt(ex.step)} kg: la última vez saliste completa${ex.rir != null ? ` con RIR ${ex.rir} o más` : ''}`};
}
function newSession(date, sk){
  const t = SESS[sk]; const items = {};
  t.items.forEach(k => { items[k] = defaultItem(k, date); });
  return {date, key:sk, name:t.name, week:weekOf(date), items, knee:null, note:'', done:false};
}
function defaultItem(k, date){
  const ex = EX[k]; const wk = clampWk(weekOf(date));
  const n = ex.sets ? setsFor(ex, wk) : 0;
  if (ex.kind === 'load' || ex.kind === 'added') { const sg = suggest(k, date); return {sets: Array.from({length:n}, () => ({kg: sg.kg, reps: ex.reps, done:false})), rir:null}; }
  if (ex.kind === 'reps') return {sets: Array.from({length:n}, () => ({reps: ex.reps, done:false}))};
  if (ex.kind === 'height') { const h = history(k, date); const cm = h.length ? (h[0].it.sets.find(x => x.done && x.cm != null) || {}).cm ?? null : null; return {sets: Array.from({length:n}, () => ({cm, reps: ex.reps, done:false}))}; }
  if (ex.kind === 'leftright') { const h = history(k, date); const l = h.length ? h[0].it : null; return {op:{kg: l && l.op ? l.op.kg : null, reps: ex.reps}, sana:{kg: l && l.sana ? l.sana.kg : null, reps: ex.reps}, done:false}; }
  if (ex.kind === 'count') return {count:0};
  if (ex.kind === 'check') return {done:false};
  return {};
}
function prescription(k, wk){
  const ex = EX[k]; const w = clampWk(wk);
  if (ex.kind === 'cardio') {
    if (k === 'fondo') return wk > BLOCK_WEEKS ? 'Distancia según la nueva planificación' : `${fmt(FONDO[w])} km suaves`;
    if (k === 'interm') return wk > BLOCK_WEEKS ? 'Series según la nueva planificación' : `${INTERM[w]} de 15 s / 15 s`;
    return (w >= 3 && w <= 4) ? '35–40 min · si vienes en verde, 20–25 de ellos en trote suave' : '35–40 min en zona suave';
  }
  if (ex.kind === 'check') return ex.label;
  if (ex.kind === 'count') return `${countTarget(ex, w)} ${ex.unit}`;
  const n = setsFor(ex, w);
  if (ex.kind === 'leftright') return `${n}×${ex.repsLabel || ex.reps} por pierna`;
  return `${n}×${ex.repsLabel || ex.reps}${ex.rir != null ? ` · RIR ${ex.rir}` : ''}${isDeload(w) ? ' · descarga' : ''}`;
}
function cardioFor(date, k){
  const ex = EX[k]; const types = [ex.ctype].concat(ex.also || []);
  return [...S.cardio.entries()].filter(([, c]) => c.date === date && types.includes(c.type));
}
function exDone(k, it, date){
  const ex = EX[k]; if (!it) return false;
  if (it.sets) return it.sets.length > 0 && it.sets.every(x => x.done);
  if (ex.kind === 'count') return (it.count || 0) >= countTarget(ex, clampWk(weekOf(date)));
  if (ex.kind === 'cardio') return cardioFor(date, k).length > 0;
  return !!it.done;
}
function sessionHasData(s){
  if (!s) return false;
  if (s.knee != null || s.note || s.done) return true;
  return Object.keys(s.items || {}).some(k => hasDone(s.items[k], EX[k]));
}
function symmetry(it){ if (!it || !it.op || !it.sana) return null; const a = e1rm(it.op.kg, it.op.reps), b = e1rm(it.sana.kg, it.sana.reps); return (a && b) ? a / b * 100 : null; }
function setsSummary(it, ex){
  const done = (it.sets || []).filter(s => s.done);
  if (!done.length) return 'sin series';
  const rir = it.rir != null ? ` · RIR ${it.rir === 4 ? '4+' : it.rir}` : '';
  if (ex.kind === 'reps') return `${done.map(s => s.reps).join(' · ')} ${ex.repsUnit || 'reps'}${rir}`;
  const f = ex.kind === 'height' ? 'cm' : 'kg';
  const u = ex.kind === 'height' ? ' cm' : ' kg';
  const pre = ex.kind === 'added' ? '+' : '';
  const same = done.every(s => s[f] === done[0][f]);
  return (same ? `${pre}${fmt(done[0][f])}${u} × ${done.map(s => s.reps).join(' · ')}` : done.map(s => `${pre}${fmt(s[f])}×${s.reps}`).join(' · ')) + rir;
}
function cardioLine(c){
  return [CT[c.type] ? CT[c.type].name : c.type, c.km != null ? `${fmt(c.km)} km` : null, c.min != null ? `${fmt(c.min)} min` : null,
    c.km && c.min ? `${pace(c.km, c.min)}/km` : null, c.rpe != null ? `esfuerzo ${c.rpe}/10` : null, c.knee != null ? `rodilla ${c.knee}/10` : null].filter(Boolean).join(' · ');
}
function pace(km, min){ if (!km || !min) return ''; const sec = min * 60 / km; return mmss(sec); }

/* Peso y sueño: un registro por mañana en la colección body (id = fecha) */
const QUAL = {mal:'Mal', regular:'Regular', bien:'Bien'};
const SLEEP_GOAL = 8, SLEEP_LOW = 7;
const round1 = x => Math.round(x * 10) / 10;
const bodyPend = {t:0, date:null, rec:null};
function bodyRec(date){ return (bodyPend.rec && bodyPend.date === date) ? bodyPend.rec : (S.body.get(date) || null); }
function sleepOf(date){ const b = bodyRec(date); if (b && b.sleep != null) return b.sleep; const c = S.checkins.get(date); return c && c.sleep != null ? c.sleep : null; }
function weighIns(){
  const m = new Map();
  S.body.forEach((b, id) => { const d = (b && b.date) || id; if (b && b.kg != null && validDate(d)) m.set(d, b.kg); });
  if (bodyPend.rec) { if (bodyPend.rec.kg != null) m.set(bodyPend.date, bodyPend.rec.kg); else m.delete(bodyPend.date); }
  return [...m.entries()].map(([date, kg]) => ({date, kg})).sort((a, b) => a.date.localeCompare(b.date));
}
const kgAvg7 = (list, date) => { const from = addDays(date, -6); const v = list.filter(w => w.date >= from && w.date <= date).map(w => w.kg); return v.length ? avg(v) : null; };
function bwOn(date, list){ let kg = null; for (const w of list) { if (w.date <= date) kg = w.kg; else break; } return kg != null ? kg : (num(S.settings.bodyweight) || BW_DEFAULT); }
function setBody(date, patch, delay){
  if (S.mode === 'readonly') { toast('Solo lectura: no puedes editar esta bitácora.'); return; }
  if (bodyPend.rec && bodyPend.date !== date) flushBody();
  const base = bodyRec(date) || {date, kg:null, sleep:sleepOf(date), quality:null};
  bodyPend.date = date; bodyPend.rec = Object.assign({}, base, patch, {date});
  clearTimeout(bodyPend.t);
  if (delay) { setSave('dirty'); bodyPend.t = setTimeout(flushBody, delay); } else flushBody();
}
function flushBody(){
  clearTimeout(bodyPend.t);
  const r = bodyPend.rec; if (!r) return;
  bodyPend.rec = null; bodyPend.date = null;
  if (r.kg == null && r.sleep == null && !r.quality) { if (S.body.has(r.date)) remove('body', r.date); else if (!queues.size && !timers.size) idleSave(); return; }
  put('body', r.date, {date:r.date, kg:r.kg ?? null, sleep:r.sleep ?? null, quality:r.quality || null});
}

const app = $('#app');
const VIEWS = ['hoy','rodilla','trote','progreso','historial'];
const viewFromHash = () => { const h = (location.hash || '').slice(1); return VIEWS.includes(h) ? h : 'hoy'; };
function defaultDate(){ const t = todayISO(); return t < START ? START : t; }
function defaultSlot(date){ return (dayPlan(date).length > 1 && date === todayISO() && new Date().getHours() >= 13) ? 1 : 0; }
function isTyping(){ const a = document.activeElement; return !!(a && app.contains(a) && a.matches('input.num, input.text:not([type=date]), textarea:not([readonly])')); }
let raf = 0;
function scheduleRender(){ if (raf) return; raf = requestAnimationFrame(() => { raf = 0; render(); }); }
function render(){
  if (isTyping()) { S.pending = true; return; }
  S.pending = false;
  VIEWS.forEach(v => { $('#v-' + v).hidden = v !== S.view; });
  document.querySelectorAll('nav.tabs a').forEach(a => { if (a.dataset.v === S.view) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current'); });
  renderHeader(); renderBanner();
  const fn = {hoy:viewHoy, rodilla:viewRodilla, trote:viewTrote, progreso:viewProgreso, historial:viewHistorial}[S.view];
  $('#v-' + S.view).innerHTML = fn();
}
function weekText(wk){ return wk < 1 ? 'Antes del bloque 1' : wk <= BLOCK_WEEKS ? `Semana ${wk} de ${BLOCK_WEEKS}${isDeload(wk) ? ' · descarga' : ''}` : `Semana ${wk}`; }
function renderHeader(){
  const wk = weekOf(S.date);
  $('#weekChip').textContent = wk < 1 ? 'El bloque parte el vie 6 nov' : wk <= BLOCK_WEEKS ? `Semana ${wk} de ${BLOCK_WEEKS}${isDeload(wk) ? ' · descarga' : ''}` : 'Bloque terminado';

  let h = '';

const lightChip = (l, extra) => l ? `<span class="light" data-l="${l}"><i></i>${LIGHT[l].word}${extra ? ` · ${esc(extra)}` : ''}</span>` : '';

  const date = S.date, dow = parse(date).getDay();
  const keys = dayPlan(date);
  if (S.sessIdx >= keys.length) S.sessIdx = 0;
  const sk = keys[S.sessIdx];
  const ci = S.checkins.get(date); const L = lightOf(ci);
  let h = dateNav();
  h += `<div class="card knee-row"><div class="row"><span class="label">Rodilla al despertar</span>${ci ? lightChip(L, `${ci.pain}/10`) : '<span class="muted">Sin check-in</span>'}</div><a class="btn ${ci ? '' : 'primary'}" href="#rodilla">${ci ? 'Editar' : 'Registrar'}</a></div>`;
  if (L === 'amarillo' || L === 'rojo') h += `<div class="banner" data-l="${L}"><b>${LIGHT[L].word}:</b> ${LIGHT[L].todo}</div>`;
  h += bodyCardHTML(date);
  if (keys.length > 1) h += `<div class="seg slots" role="tablist" aria-label="Sesión del día">${keys.map((k, i) => `<button type="button" role="tab" aria-selected="${i === S.sessIdx}" data-act="slot" data-i="${i}"><b>${SESS[k].slot}</b>${esc(SESS[k].name)}</button>`).join('')}</div>`;
  h += sessionHTML(date, sk, L);
  return h;
}
function sessionHTML(date, sk, L){
  const t = SESS[sk];
  if (sk === 'libre') return `<div class="session" data-sk="libre"><div class="sess-head"><div><h2>Descanso</h2><p class="sess-meta">Opcional: trekking suave en subida o pases con balón.</p></div></div><div class="ex"><button class="btn" type="button" data-act="logcardio" data-type="trekking">Registrar trekking</button></div></div>`;
  const id = sessionId(date, sk);
  const s = S.drafts.get(id) || S.sessions.get(id) || newSession(date, sk);
  const items = s.items || {};
  const kneeSess = t.items.some(k => EX[k].knee);
  let h = `<div class="session" data-sk="${sk}"><div class="sess-head"><div><h2>${esc(t.name)}</h2><p class="sess-meta">${esc([t.slot, t.time].filter(Boolean).join(' · '))}${s.done ? `${t.slot || t.time ? ' · ' : ''}<span class="ok">Terminada</span>` : ''}</p></div><span id="sp-${sk}">${sessProgress(s, sk, date)}</span></div>`;
  if (L === 'rojo' && kneeSess) h += '<div class="sess-warn">Rodilla en rojo: salta lo marcado y haz solo torso, bici suave o caminata.</div>';
  if (t.pre) h += `<p class="sess-pre">${esc(t.pre)}</p>`;
  let group = null;
  t.items.forEach(k => {
    const ex = EX[k];
    if (ex.group && ex.group !== group) h += `<div class="group"><span class="label">${esc(ex.group)}</span><span class="muted">~15–20 min</span></div>`;
    group = ex.group || null;
    h += exHTML(k, items[k] || defaultItem(k, date), date, L);
  });
  h += sessFoot(s);
  return h + '</div>';
}
function sessProgress(s, sk, date){
  const keys = SESS[sk].items; const n = keys.filter(k => exDone(k, (s.items || {})[k], date)).length;
  return `<span class="prog${n === keys.length ? ' full' : ''}">${n}/${keys.length}</span>`;
}
function exBadge(k, it, date){
  const ex = EX[k];
  if (it.sets) { const n = it.sets.filter(x => x.done).length; return `<span class="prog${n && n === it.sets.length ? ' full' : ''}">${n}/${it.sets.length}</span>`; }
  if (ex.kind === 'count') { const tg = countTarget(ex, clampWk(weekOf(date))); return `<span class="prog${(it.count || 0) >= tg ? ' full' : ''}">${it.count || 0}/${tg}</span>`; }
  return exDone(k, it, date) ? '<span class="prog full">Hecho</span>' : '';
}
function exHTML(k, it, date, L){
  const ex = EX[k]; const wk = weekOf(date);
  const skip = L === 'rojo' && ex.knee;
  let body = '';
  if (it.sets) body = setsHTML(k, it, ex) + (ex.rir != null ? rirHTML(k, it) : '') + hintHTML(k, date);

  else if (ex.kind === 'check') body = checkBtn('check', it.done);

/* ---------------- Trote ---------------- */
function viewTrote(){
  const mon = mondayOf(S.date), sun = addDays(mon, 6), wk = weekOf(sun);
  const list = [...S.cardio.entries()].filter(([, c]) => c.date >= mon && c.date <= sun).sort((a, b) => b[1].date.localeCompare(a[1].date));
  const runs = list.filter(([, c]) => CT[c.type] && CT[c.type].run);
  const km = sum(runs.map(([, c]) => c.km));
  const fondoKm = Math.max(0, ...list.filter(([, c]) => c.type === 'fondo').map(([, c]) => c.km || 0));
  const plan = wk >= 1 && wk <= BLOCK_WEEKS ? FONDO[wk] : null;
  const other = sum(list.filter(([, c]) => !(CT[c.type] && CT[c.type].run)).map(([, c]) => c.min));
  if (!S.cd) S.cd = {date:S.date, type:'suave', km:null, min:null, rpe:null, knee:null, note:''};
  let h = `<div class="weeknav"><button class="btn icon" type="button" data-act="day" data-d="-7" aria-label="Semana anterior"${mon <= START ? ' disabled' : ''}>${ICON.left}</button><div><b>${esc(shortDate(mon))} – ${esc(shortDate(sun))}</b><span class="muted sm">${esc(weekText(wk))}</span></div><button class="btn icon" type="button" data-act="day" data-d="7" aria-label="Semana siguiente">${ICON.right}</button></div>`;
  h += `<div class="stats"><div class="stat"><small>Trote</small><b>${fmt(Math.round(km * 10) / 10)}</b><small>km en ${runs.length} ${runs.length === 1 ? 'salida' : 'salidas'}</small></div><div class="stat"><small>Fondo largo</small><b>${fondoKm ? fmt(fondoKm) : '—'}</b><small>${plan ? `de ${fmt(plan)} km planificados` : 'km'}</small></div><div class="stat"><small>Bici y otros</small><b>${fmt(other)}</b><small>min</small></div></div>`;
  h += cardioForm();
  h += '<div class="card pad"><h2 class="h" style="margin-bottom:6px">Esta semana</h2>';
  h += list.length ? list.map(([id, c]) => `<div class="entry"><div class="entry-main"><b>${esc(CT[c.type] ? CT[c.type].name : c.type)}</b><p class="muted sm">${esc(shortDay(c.date))} · ${esc(cardioLine(c).split(' · ').slice(1).join(' · ') || 'sin datos')}</p>${c.note ? `<p class="sm">${esc(c.note)}</p>` : ''}</div><div class="entry-act"><button class="btn sm" type="button" data-act="editcardio" data-id="${esc(id)}">Editar</button><button class="btn sm danger" type="button" data-act="del" data-col="cardio" data-id="${esc(id)}">Borrar</button></div></div>`).join('') : '<div class="empty" style="margin-top:8px"><p>Sin salidas esta semana. Regístralas arriba o desde la sesión del día en Hoy.</p></div>';
  h += '</div>' + weeklyKmHTML();
  return h;
}

function weeklyKmHTML(){
  const cur = mondayOf(S.date);
  const firstData = [...S.cardio.values()].map(c => c.date).sort()[0];
  let start = mondayOf(firstData && firstData < START ? firstData : START);
  if (cur < start) start = cur;
  const mons = []; for (let m = start; m <= cur; m = addDays(m, 7)) mons.push(m);
  const rows = mons.slice(-10).map(m => {
    const e = addDays(m, 6); const cs = [...S.cardio.values()].filter(c => c.date >= m && c.date <= e);
    const wk = weekOf(addDays(m, 6));
    return {m, km: Math.round(sum(cs.filter(c => CT[c.type] && CT[c.type].run).map(c => c.km)) * 10) / 10, fondo: Math.max(0, ...cs.filter(c => c.type === 'fondo').map(c => c.km || 0)), plan: wk >= 1 && wk <= BLOCK_WEEKS ? FONDO[wk] : null};
  });
  let h = '<div class="card pad stack"><h2 class="h">Kilómetros por semana</h2>';
  if (!rows.some(r => r.km || r.fondo)) return h + '<div class="empty"><b>Aún sin kilómetros.</b><p>Cuando registres trotes, aquí ves el total de cada semana y tu fondo largo contra lo planificado.</p></div></div>';
  h += '<div class="legend"><span><i class="sw"></i>Trote total</span><span><i class="sw dotk"></i>Fondo largo</span><span><i class="sw plan"></i>Fondo planificado</span></div>';

  h += dataTable(['Semana','Trote','Fondo','Plan'], rows.slice().reverse().map(r => [shortDate(r.m), `${fmt(r.km)} km`, r.fondo ? `${fmt(r.fondo)} km` : '—', r.plan ? `${fmt(r.plan)} km` : '—']));

/* ---------------- Progreso ---------------- */
function viewProgreso(){
  const lifts = Object.keys(EX).filter(k => EX[k].lift);
  if (!lifts.includes(S.lift)) S.lift = lifts[0];
  let h = `<div class="card pad stack"><h2 class="h">Fuerza</h2><div class="chips" role="tablist" aria-label="Ejercicio">${lifts.map(k => `<button type="button" role="tab" aria-selected="${S.lift === k}" data-act="lift" data-v="${k}">${esc(EX[k].short || EX[k].name)}</button>`).join('')}</div>${liftChart(S.lift)}</div>`;
  h += weightHTML() + sleepHTML() + testsHTML() + summaryHTML() + settingsHTML();
  return h;
}
function liftPoints(k){
  const ex = EX[k]; const ws = weighIns(); const by = new Map();
  allSessions().forEach(s => {
    const it = s.items && s.items[k]; if (!it || !it.sets) return;
    const bw = ex.kind === 'added' ? bwOn(s.date, ws) : 0;
    it.sets.filter(x => x.done && x.kg != null && x.reps).forEach(x => {
      const e = ex.kind === 'added' ? e1rm(bw + x.kg, x.reps) - bw : e1rm(x.kg, x.reps);
      const cur = by.get(s.date);
      if (!cur || e > cur.y) by.set(s.date, {x:s.date, y:Math.round(e * 10) / 10, kg:x.kg, reps:x.reps});
    });
  });
  return [...by.values()].sort((a, b) => a.x.localeCompare(b.x));
}
function liftChart(k){
  const ex = EX[k]; const pts = liftPoints(k); const pre = ex.kind === 'added' ? '+' : '';
  if (!pts.length) return `<div class="empty"><b>Aún sin series de ${esc(ex.name.toLowerCase())}.</b><p>Cuando marques series como hechas en Hoy, aquí aparece tu 1RM estimado de cada sesión.</p></div>`;
  pts.forEach(p => { p.tip = `${shortDate(p.x)} · ${pre}${fmt(p.kg)} kg × ${p.reps} → 1RM est. ${pre}${fmt(p.y)} kg`; });
  const first = pts[0], last = pts[pts.length - 1]; const d = Math.round((last.y - first.y) * 10) / 10;

function weekSummary(date){
  const mon = mondayOf(date), sun = addDays(mon, 6), wk = weekOf(sun);
  const days = Array.from({length:7}, (_, i) => addDays(mon, i));
  const L = [];
  L.push(`Bitácora · ${wk >= 1 ? `semana ${wk}${wk <= BLOCK_WEEKS ? ` de ${BLOCK_WEEKS}` : ''}` : 'antes del bloque'} (${shortDate(mon)} – ${shortDate(sun)})`, '');
  L.push('Rodilla al despertar: ' + days.map(d => { const c = S.checkins.get(d); return `${DOW[parse(d).getDay()]} ${c && c.pain != null ? `${c.pain}/10 ${LIGHT[lightOf(c)].word.toLowerCase()}` : '—'}`; }).join(' · '));
  const sl = days.map(sleepOf).filter(v => v != null);
  const qs = days.map(d => { const b = bodyRec(d); return b && b.quality; }).filter(Boolean);
  const qTxt = qs.length ? ' · calidad: ' + Object.keys(QUAL).reverse().filter(k => qs.includes(k)).map(k => `${qs.filter(x => x === k).length} ${QUAL[k].toLowerCase()}`).join(', ') : '';
  const shortN = sl.filter(v => v < SLEEP_LOW).length;
  L.push(`Sueño: ${sl.length ? `${fmt(round1(avg(sl)))} h de promedio (${sl.length} ${sl.length === 1 ? 'noche' : 'noches'})${shortN ? ` · ${shortN} con menos de ${SLEEP_LOW} h` : ''}${qTxt}` : 'sin registro'}`);
  const ws = weighIns(); const wkW = ws.filter(w => w.date >= mon && w.date <= sun).map(w => w.kg); const prevW = ws.filter(w => w.date >= addDays(mon, -7) && w.date < mon).map(w => w.kg);
  L.push(`Peso: ${wkW.length ? `${fmt(round1(avg(wkW)))} kg de promedio (${wkW.length} ${wkW.length === 1 ? 'pesaje' : 'pesajes'})${prevW.length ? ` · semana anterior ${fmt(round1(avg(prevW)))} kg` : ''}` : 'sin registro'}`);
  const ss = allSessions().filter(s => s.date >= mon && s.date <= sun && sessionHasData(s)).sort((a, b) => a.date.localeCompare(b.date));
  L.push(`Sesiones con registros: ${ss.length}`);
  const sets = [];
  ss.forEach(s => Object.keys(s.items || {}).forEach(k => { const ex = EX[k]; const it = s.items[k]; if (ex && it && it.sets && it.sets.some(x => x.done)) sets.push(`- ${ex.name} (${DOW[parse(s.date).getDay()]}): ${setsSummary(it, ex)}`); }));
  if (sets.length) L.push('', 'Series hechas:', ...sets);
  const sym = ss.map(s => symmetry(s.items && s.items.rod_ext)).filter(v => v != null);
  if (sym.length) L.push(`Simetría extensión (operada/sana): ${sym.map(v => Math.round(v) + '%').join(' · ')}`);
  const kd = ss.filter(s => s.knee != null).map(s => `${(SESS[s.key] && SESS[s.key].name) || s.name} ${s.knee}/10`);
  if (kd.length) L.push('', 'Rodilla durante las sesiones: ' + kd.join(' · '));
  const cs = [...S.cardio.values()].filter(c => c.date >= mon && c.date <= sun).sort((a, b) => a.date.localeCompare(b.date));
  const run = cs.filter(c => CT[c.type] && CT[c.type].run);
  L.push('', `Trote: ${fmt(Math.round(sum(run.map(c => c.km)) * 10) / 10)} km en ${run.length} ${run.length === 1 ? 'salida' : 'salidas'}${wk >= 1 && wk <= BLOCK_WEEKS ? ` · fondo planificado ${FONDO[wk]} km` : ''}`);
  cs.forEach(c => L.push(`- ${DOW[parse(c.date).getDay()]}: ${cardioLine(c)}`));
  const notes = ss.filter(s => s.note).map(s => `- ${(SESS[s.key] && SESS[s.key].name) || s.name}: ${s.note}`)
    .concat(days.map(d => S.checkins.get(d)).filter(c => c && c.note).map(c => `- Rodilla ${shortDay(c.date)}: ${c.note}`))
    .concat(cs.filter(c => c.note).map(c => `- ${CT[c.type] ? CT[c.type].name : c.type} ${shortDay(c.date)}: ${c.note}`));
  if (notes.length) L.push('', 'Notas:', ...notes);
  return L.join('\n');
}

/* ---------------- Gráficos ---------------- */
function niceTicks(lo, hi, n){
  const span = (hi - lo) || 1; const raw = span / Math.max(1, n - 1);
  const mag = Math.pow(10, Math.floor(Math.log10(raw)));
  const step = [1, 2, 2.5, 5, 10].map(m => m * mag).find(s => s >= raw) || 10 * mag;
  const a = Math.floor(lo / step) * step, b = Math.ceil(hi / step) * step;
  const out = []; for (let v = a; v <= b + step / 2; v += step) out.push(Math.round(v * 1000) / 1000);
  return out;
}
function lineChart(o){
  const pts = o.pts, w = 340, hgt = 200, pl = 36, pr = o.endLabel === false ? 14 : 50, pt = 14, pb = 26;
  const ts = pts.map(p => parse(p.x).getTime());
  let x0 = o.xDomain ? parse(o.xDomain[0]).getTime() : Math.min(...ts), x1 = o.xDomain ? parse(o.xDomain[1]).getTime() : Math.max(...ts);
  if (x1 - x0 < 6 * 864e5) { const m = (x0 + x1) / 2; x0 = m - 3 * 864e5; x1 = m + 3 * 864e5; }
  const vals = pts.map(p => p.y).concat((o.refs || []).map(r => r.y)).concat((o.trend || []).map(p => p.y));
  let lo = Math.min(...vals), hi = Math.max(...vals);
  if (o.yMin != null) lo = Math.min(lo, o.yMin); else { const p = (hi - lo) * 0.2 || Math.max(1, Math.abs(hi) * 0.05); lo -= p; hi += p; }
  if (o.yMax != null) hi = Math.max(hi, o.yMax);
  const ticks = niceTicks(lo, hi, 4); lo = ticks[0]; hi = ticks[ticks.length - 1];
  const X = t => pl + (t - x0) / (x1 - x0) * (w - pl - pr);
  const Y = v => pt + (1 - (v - lo) / (hi - lo)) * (hgt - pt - pb);
  let g = '';
  ticks.forEach(v => { g += `<line class="grid" x1="${pl}" x2="${w - pr + 6}" y1="${Y(v).toFixed(1)}" y2="${Y(v).toFixed(1)}"/><text x="${pl - 6}" y="${(Y(v) + 3.5).toFixed(1)}" text-anchor="end">${fmt(v)}</text>`; });
  (o.refs || []).forEach(r => { g += `<line class="ref" x1="${pl}" x2="${w - pr + 6}" y1="${Y(r.y).toFixed(1)}" y2="${Y(r.y).toFixed(1)}"/><text class="reflbl" x="${pl + 4}" y="${(Y(r.y) - 4).toFixed(1)}">${esc(r.label)}</text>`; });
  const xl = o.xDomain ? [o.xDomain[0], o.xDomain[1]] : [pts[0].x, pts[pts.length - 1].x];
  if (xl[1] === xl[0]) g += `<text x="${X(ts[0]).toFixed(1)}" y="${hgt - 6}" text-anchor="middle">${esc(shortDate(xl[0]))}</text>`;
  else g += `<text x="${pl}" y="${hgt - 6}" text-anchor="start">${esc(shortDate(xl[0]))}</text><text x="${w - pr}" y="${hgt - 6}" text-anchor="end">${esc(shortDate(xl[1]))}</text>`;
  if (o.line !== false && pts.length > 1) g += `<path class="ln" d="${pts.map((p, i) => `${i ? 'L' : 'M'}${X(ts[i]).toFixed(1)} ${Y(p.y).toFixed(1)}`).join(' ')}"/>`;
  pts.forEach((p, i) => { g += `<circle class="pt${p.cls ? ' ' + p.cls : ''}" cx="${X(ts[i]).toFixed(1)}" cy="${Y(p.y).toFixed(1)}" r="${o.r || 4.5}"/>`; });
  const tr = o.trend || [];
  if (tr.length > 1) g += `<path class="trend" d="${tr.map((p, i) => `${i ? 'L' : 'M'}${X(parse(p.x).getTime()).toFixed(1)} ${Y(p.y).toFixed(1)}`).join(' ')}"/>`;
  pts.forEach((p, i) => { g += `<circle class="hit" cx="${X(ts[i]).toFixed(1)}" cy="${Y(p.y).toFixed(1)}" r="13" tabindex="0" role="img" aria-label="${esc(p.tip)}" data-tip="${esc(p.tip)}"/>`; });
  if (o.endLabel !== false) { const src = tr.length ? tr : pts; const e = src[src.length - 1]; g += `<text class="endlbl" x="${(X(parse(e.x).getTime()) + 9).toFixed(1)}" y="${(Y(e.y) + 4).toFixed(1)}">${fmt(e.y)}${o.unit || ''}</text>`; }
  return `<svg class="chart" viewBox="0 0 ${w} ${hgt}" role="group" aria-label="${esc(o.label)}">${g}</svg>`;
}
function sleepChart(rows){

  rows.forEach((r, i) => {

    if ((rows.length - 1 - i) % 7 === 0) g += `<text x="${cx.toFixed(1)}" y="${hgt - 6}" text-anchor="middle">${esc(shortDate(r.d))}</text>`;
  });
  g += `<line class="ref" x1="${pl}" x2="${w - pr}" y1="${Y(SLEEP_GOAL).toFixed(1)}" y2="${Y(SLEEP_GOAL).toFixed(1)}"/><text class="reflbl" x="${pl - 6}" y="${(Y(SLEEP_GOAL) + 3.5).toFixed(1)}" text-anchor="end">${SLEEP_GOAL} h</text>`;
  g += `<line class="axis" x1="${pl}" x2="${w - pr}" y1="${Y(0)}" y2="${Y(0)}"/>`;
  rows.forEach((r, i) => {
    const tip = `${dayLabel(r.d)} · ${r.h != null ? `${fmt(r.h)} h${r.h < SLEEP_LOW ? ', menos de ' + SLEEP_LOW + ' h' : ''}${r.q ? ` · durmió ${QUAL[r.q].toLowerCase()}` : ''}` : 'sin registro'}`;
    g += `<rect class="hit" x="${(pl + band * i).toFixed(1)}" y="${pt}" width="${band.toFixed(1)}" height="${hgt - pt - pb}" tabindex="${r.h != null ? 0 : -1}" role="img" aria-label="${esc(tip)}" data-tip="${esc(tip)}"/>`;
  });
  return `<svg class="chart" viewBox="0 0 ${w} ${hgt}" role="group" aria-label="Horas de sueño de las últimas 4 semanas">${g}</svg>`;

function barTop(x, y, w, h, r){ r = Math.min(r, w / 2, h); return `M${x} ${y + h}V${y + r}Q${x} ${y} ${x + r} ${y}H${x + w - r}Q${x + w} ${y} ${x + w} ${y + r}V${y + h}Z`; }
function kmChart(rows){
  const w = 340, hgt = 210, pl = 36, pr = 10, pt = 14, pb = 26;
  const hiV = Math.max(5, ...rows.map(r => Math.max(r.km, r.fondo, r.plan || 0)));
  const ticks = niceTicks(0, hiV * 1.08, 4); const hi = ticks[ticks.length - 1];
  const band = (w - pl - pr) / rows.length, bw = Math.min(22, band * 0.55);
  const Y = v => pt + (1 - v / hi) * (hgt - pt - pb);
  let g = '';
  ticks.forEach(v => { g += `<line class="grid" x1="${pl}" x2="${w - pr}" y1="${Y(v).toFixed(1)}" y2="${Y(v).toFixed(1)}"/><text x="${pl - 6}" y="${(Y(v) + 3.5).toFixed(1)}" text-anchor="end">${fmt(v)}</text>`; });
  rows.forEach((r, i) => {
    const cx = pl + band * i + band / 2;
    if (r.km > 0) g += `<path class="bar" d="${barTop(cx - bw / 2, Y(r.km), bw, Y(0) - Y(r.km), 4)}"/>`;
    if (r.plan) g += `<line class="plan" x1="${(cx - band * 0.42).toFixed(1)}" x2="${(cx + band * 0.42).toFixed(1)}" y1="${Y(r.plan).toFixed(1)}" y2="${Y(r.plan).toFixed(1)}"/>`;
    if (r.fondo > 0) g += `<circle class="fondo" cx="${cx.toFixed(1)}" cy="${Y(r.fondo).toFixed(1)}" r="4.5"/>`;
    if (rows.length <= 6 || i % 2 === (rows.length - 1) % 2) g += `<text x="${cx.toFixed(1)}" y="${hgt - 6}" text-anchor="middle">${esc(shortDate(r.m))}</text>`;
    const tip = `Semana del ${shortDate(r.m)} · trote ${fmt(r.km)} km${r.fondo ? ` · fondo ${fmt(r.fondo)} km` : ''}${r.plan ? ` · plan ${fmt(r.plan)} km` : ''}`;
    g += `<rect class="hit" x="${(cx - band / 2).toFixed(1)}" y="${pt}" width="${band.toFixed(1)}" height="${hgt - pt - pb}" tabindex="0" role="img" aria-label="${esc(tip)}" data-tip="${esc(tip)}"/>`;
  });
  g += `<line class="axis" x1="${pl}" x2="${w - pr}" y1="${Y(0)}" y2="${Y(0)}"/>`;
  return `<svg class="chart" viewBox="0 0 ${w} ${hgt}" role="group" aria-label="Kilómetros de trote por semana">${g}</svg>`;
}

    case 'check': { const c = exContext(b); if (!c) return; c.it.done = !c.it.done; markDirty(sessionId(S.date, c.sk)); refreshEx(c, `#ex-${c.k} [data-act="check"]`); break; }

function onPain(b){

let restEnd = 0, restTimer = 0;

function tickRest(){

  $('#restTime').textContent = left > 0 ? `${Math.floor(left / 60)}:${pad(left % 60)}` : '¡Vamos!';
  if (left <= 0 && r.dataset.done !== '1') { r.dataset.done = '1'; clearInterval(restTimer); try { if (navigator.vibrate) navigator.vibrate([200, 100, 200]); } catch (e) {} setTimeout(() => { if (Date.now() >= restEnd + 5000) r.hidden = true; }, 6000); }

function goLocal(){
  S.mode = 'local';
  const o = Local.read();
  COLS.forEach(col => { const m = mapFor(col); Object.entries(o[col] || {}).forEach(([id, v]) => { if (v) m.set(id, v); }); });
  if (o.settings && o.settings.main) S.settings = Object.assign({}, S.settings, o.settings.main);
  setSave('local'); scheduleRender();
}
let synced = false, allReady = false;
function maybeSync(){
  if (synced || !COLS.every(c => S.loaded[c])) return;
  synced = true;
  const o = Local.read(); let n = 0;
  COLS.forEach(col => Object.entries(o[col] || {}).forEach(([id, v]) => { const cur = mapFor(col).get(id); if (v && (!cur || (v.updatedAt || '') > (cur.updatedAt || ''))) { mapFor(col).set(id, v); enqueue(`${col}/${id}`, v); n++; } }));
  if (o.settings && o.settings.main) enqueue('settings/main', o.settings.main);
  if (n || (o.settings && o.settings.main)) { Local.clear(); if (n) toast(`Subí ${n} ${n === 1 ? 'registro guardado' : 'registros guardados'} en este teléfono.`); scheduleRender(); }
}
function subscribe(col){
  const timer = setTimeout(() => { if (!S.loaded[col]) { S.stale = true; if (!queues.size && !timers.size) setSave('offline'); scheduleRender(); } }, 10000);
  db.collection(col).onSnapshot(snap => {
    const m = mapFor(col); m.clear();
    snap.docs.forEach(d => { if (d.exists) m.set(d.id, d.data()); });
    let wasLoaded = S.loaded[col];
    if (!snap.metadata.fromCache) { S.loaded[col] = true; clearTimeout(timer); if (S.stale && COLS.every(c => S.loaded[c])) { S.stale = false; if (!queues.size && !timers.size) idleSave(); } maybeSync(); }
    if (!allReady && COLS.every(c => S.loaded[c])) { allReady = true; if (S.mode === 'cloud' && !queues.size && !timers.size) idleSave(); }
    if (col === 'sessions' && wasLoaded && snap.docChanges().every(ch => S.drafts.has(ch.doc.id))) return;
    scheduleRender();
  }, err => {
    clearTimeout(timer); S.loaded[col] = true;
    if (err && (err.code === 'revoked' || err.code === 'not_granted' || err.code === 'capability_disabled' || err.code === 'capability_removed')) { db = null; goLocal(); return; }
    S.stale = true; setSave('offline'); scheduleRender();
  });
}
async function init(){
  S.date = defaultDate(); S.sessIdx = defaultSlot(S.date); S.view = viewFromHash();
  render();
  const cl = window.claude;
  let dbns = null, userns = null;
  try { [dbns, userns] = await Promise.all([cl && cl.use ? cl.use('db') : null, cl && cl.use ? cl.use('user') : null]); } catch (e) {}
  if (!dbns) { goLocal(); return; }
  db = dbns; S.mode = 'cloud'; setSave('connecting');
  if (userns) { try { const w = await userns.can('data.write'); if (w === false) { S.mode = 'readonly'; document.body.classList.add('ro'); setSave('readonly'); } } catch (e) {} }
  COLS.forEach(subscribe);
  db.doc('settings/main').onSnapshot(d => { if (d.exists) { S.settings = Object.assign({bodyweight:BW_DEFAULT}, d.data()); scheduleRender(); } }, () => {});
}

/* ---------------- Respaldo ---------------- */
const BK_KEY = 'bitacora-ultimo-respaldo';
function lastBackupText(){ let d = null; try { d = localStorage.getItem(BK_KEY); } catch (e) {} return d ? ` Último respaldo: ${dayLabel(d).toLowerCase()}.` : ' Todavía no exportas ninguno.'; }
async function exportBackup(){
  flushAll();
  const data = Local.read();
  const body = JSON.stringify({app:'bitacora-rugby21k', version:1, exportedAt:new Date().toISOString(), data}, null, 1);
  const name = `bitacora-respaldo-${todayISO()}.json`;
  const done = () => { try { localStorage.setItem(BK_KEY, todayISO()); } catch (e) {} toast('Respaldo listo'); render(); };
  try {
    const file = new File([body], name, {type:'application/json'});
    if (navigator.canShare && navigator.canShare({files:[file]})) { await navigator.share({files:[file], title:'Respaldo bitácora'}); done(); return; }
  } catch (e) { if (e && e.name === 'AbortError') return; }
  const url = URL.createObjectURL(new Blob([body], {type:'application/json'}));
  const a = document.createElement('a'); a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 4000); done();
}
function importBackup(file){
  if (!file) return;
  const r = new FileReader();
  r.onload = () => {
    let o; try { o = JSON.parse(r.result); } catch (e) { toast('Ese archivo no es un respaldo de la bitácora.'); return; }
    const d = o && o.app === 'bitacora-rugby21k' && o.data;
    if (!d || typeof d !== 'object') { toast('Ese archivo no es un respaldo de la bitácora.'); return; }
    const cur = Local.read(); let n = 0;
    COLS.concat(['settings']).forEach(col => { const src = d[col]; if (!src || typeof src !== 'object') return; cur[col] = cur[col] || {};
      Object.entries(src).forEach(([id, v]) => { const c = cur[col][id]; if (v && (!c || (v.updatedAt || '') >= (c.updatedAt || ''))) { cur[col][id] = v; n++; } }); });
    if (!Local.write(cur)) { toast('No se pudo guardar el respaldo en este teléfono.'); return; }
    goLocal(); render(); toast(`Respaldo importado: ${n} ${n === 1 ? 'registro' : 'registros'}.`);
  };
  r.readAsText(file);
}
if ('serviceWorker' in navigator && location.protocol === 'https:') { window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch(() => {}); }); }
try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) {}

/* Borra del teléfono lo registrado antes del inicio del bloque */
(function purgeBeforeStart(){
  try { const o = Local.read(); let ch = false;
    COLS.forEach(c => { Object.entries(o[c] || {}).forEach(([id, v]) => { const d = (v && v.date) || String(id).slice(0, 10); if (d < START) { delete o[c][id]; ch = true; } }); });
    if (ch) Local.write(o);
  } catch (e) {}
})();
init();
})();
